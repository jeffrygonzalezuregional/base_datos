<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Datos Guardados</title>
    <style>
        body { font-family: Arial; max-width: 700px; margin: 30px auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f2f2f2; }
        a { display: inline-block; margin-top: 20px; color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Registros en la Base de Datos</h1>
    <a href="/">← Volver al formulario</a>

    <table>
        <thead>
            <tr>
                <th>NOMBRE</th>
                <th>TELEFONO</th>
                <th>DPI</th>
            </tr>
        </thead>
        <tbody>
        {% for persona in personas %}
            <tr>
                <td>{{ persona.NOMBRE }}</td>
                <td>{{ persona.TELEFONO }}</td>
                <td>{{ persona.DPI }}</td>
            </tr>
        {% else %}
            <tr>
                <td colspan="3" style="text-align:center; color:#666;">No hay registros guardados</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</body>
</html>
